# Java mods that Horizon already does by itself. Reviewed by hand: every row
# links the Horizon doc that backs it.
#
#   mods     the Java mods, as players name them
#   ids      their mod ids (fabric.mod.json "id", mods.toml "modId")
#   horizon  what does the job on Horizon
#   how      engine        always on, nothing to turn on
#            setting       built in, off by default, turned on in Horizon's settings
#            official-mod  one of Horizon's own mods, installed from the launcher's Mods page
#   where    where to turn it on
#
# Horizon's built-in extras are off by default, so a fresh game looks like vanilla.

[[builtin]]
mods = ["Sodium", "Lithium", "FerriteCore", "ModernFix", "ImmediatelyFast"]
ids = ["sodium", "lithium", "ferritecore", "modernfix", "immediatelyfast"]
horizon = "Horizon's engine"
how = "engine"
source = "https://github.com/horizon-rust/horizon/blob/main/docs/modpacks.md"

[[builtin]]
mods = ["Distant Horizons"]
ids = ["distanthorizons"]
horizon = "LOD Distance, up to 1024 chunks"
how = "setting"
where = "Options > Horizon Settings > Graphics > LOD Distance"
source = "https://github.com/horizon-rust/horizon/blob/main/docs/mods.md"

[[builtin]]
mods = ["Xaero's Minimap", "JourneyMap"]
ids = ["xaerominimap", "journeymap"]
horizon = "Minimap"
how = "official-mod"
where = "Launcher > Mods > Minimap"
source = "https://github.com/horizon-rust/horizon/blob/main/docs/mods.md"

